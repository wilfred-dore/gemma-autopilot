<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gemma² · The optimization loop</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800&family=Google+Sans+Text:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:       #0b0e14;
  --grid:     rgba(255,255,255,.06);
  --ink:      #e9ecf5;
  --ink2:     #8a90a6;
  --blue:     #58c4dd;   /* 3Blue */
  --brown:    #b58a5b;   /* 1Brown */
  --gold:     #e8a600;
  --red:      #e5483a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden;background:var(--bg);
  font-family:"Google Sans Text","Google Sans",system-ui,sans-serif;color:var(--ink)}
.stage{position:relative;width:1440px;height:900px}

/* faint blackboard grid, 3Blue1Brown style */
.gridbg{position:absolute;inset:0;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:40px 40px;
  opacity:0;animation:fadeIn 1.2s ease-out .1s forwards}

/* ── Title ─────────────────────────────────────────────────────────── */
#title{position:absolute;top:380px;left:0;right:0;text-align:center;
  font:800 52px "Google Sans",system-ui,sans-serif;letter-spacing:-.01em;
  opacity:0;transform:translateY(14px) scale(1);
  animation:titleIn 1s ease-out .3s forwards, titleShrink .8s ease-in 2.0s forwards}
#title .sub{display:block;margin-top:10px;font:500 20px "Google Sans Text",sans-serif;color:var(--ink2)}
@keyframes titleIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes titleShrink{
  from{top:380px;font-size:52px;opacity:1}
  to{top:28px;font-size:22px;opacity:.9}
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ── Plot ──────────────────────────────────────────────────────────── */
#plot{position:absolute;left:150px;top:150px;width:1140px;height:620px;opacity:0;
  animation:fadeIn .8s ease-out 2.1s forwards}
#plot svg{width:100%;height:100%;overflow:visible}

.axis-line{stroke:var(--ink2);stroke-width:2}
.axis-label{fill:var(--ink2);font:600 17px "Google Sans Text",sans-serif}

.path-line{fill:none;stroke-width:4;stroke-linecap:round}
.path-line.ok{stroke:var(--blue)}
.path-line.reject{stroke:var(--red);stroke-dasharray:10 10}

.pt{opacity:0}
.pt circle{stroke:var(--bg);stroke-width:4}
.pt text{font:700 15px "JetBrains Mono",monospace;fill:var(--ink)}
.pt .tag{font:500 13px "Google Sans Text",sans-serif;fill:var(--ink2)}

@keyframes drawLine{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes popIn{
  0%{opacity:0;transform:scale(.3)}
  60%{opacity:1;transform:scale(1.25)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes fadeDown{to{opacity:.35}}
@keyframes glowPulse{
  0%,100%{filter:drop-shadow(0 0 0 var(--gold))}
  50%{filter:drop-shadow(0 0 18px var(--gold))}
}

#seg-h1     {opacity:0}
#pt-h1      {transform-origin:232px 482px; animation:popIn .6s ease-out 3.9s forwards}

#seg-h1-a1  {stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
             animation:drawLine 1s ease-in-out 7.4s forwards}
#pt-a1      {transform-origin:561px 278px; animation:popIn .6s ease-out 8.3s forwards}

#seg-a1-a2  {stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
             animation:drawLine 1s ease-in-out 11.3s forwards}
#pt-a2      {transform-origin:728px 360px;
             animation:popIn .6s ease-out 12.2s forwards, fadeDown .6s ease-out 14.4s forwards}
#seg-a1-a2.reject{animation:drawLine 1s ease-in-out 11.3s forwards, fadeDown .6s ease-out 14.4s forwards}

#seg-a1-a3  {stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
             animation:drawLine 1s ease-in-out 16.2s forwards}
#pt-a3      {transform-origin:630px 124px; animation:popIn .6s ease-out 17.1s forwards}

#seg-a3-a4  {stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
             animation:drawLine 1s ease-in-out 20.7s forwards}
#pt-a4      {transform-origin:754px 99px;
             animation:popIn .6s ease-out 21.6s forwards, glowPulse 1.6s ease-in-out 22.4s 3}

/* ── Equation card ─────────────────────────────────────────────────── */
#eqn{position:absolute;left:50%;bottom:70px;transform:translate(-50%,30px);
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:16px;padding:16px 28px;text-align:center;opacity:0;
  animation:eqnIn .8s ease-out 24.8s forwards}
#eqn .code{font:700 22px "JetBrains Mono",monospace;color:var(--gold)}
#eqn .caption{margin-top:6px;font:500 14px "Google Sans Text",sans-serif;color:var(--ink2)}
@keyframes eqnIn{from{opacity:0;transform:translate(-50%,30px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<div class="stage">
  <div class="gridbg"></div>

  <div id="title">The optimization loop<span class="sub">one point per run, plotted live by the agent</span></div>

  <div id="plot">
    <svg viewBox="0 0 1140 620">
      <!-- axes -->
      <line class="axis-line" x1="60" y1="560" x2="1100" y2="560"/>
      <line class="axis-line" x1="60" y1="560" x2="60" y2="20"/>
      <text class="axis-label" x="560" y="605" text-anchor="middle">throughput (tokens / s) →</text>
      <text class="axis-label" x="30" y="300" text-anchor="middle" transform="rotate(-90 30 300)">energy efficiency →</text>

      <!-- gradient path -->
      <line id="seg-h1-a1" class="path-line ok"    x1="232" y1="482" x2="561" y2="278" style="--len:400"/>
      <line id="seg-a1-a2" class="path-line reject" x1="561" y1="278" x2="728" y2="360" style="--len:190"/>
      <line id="seg-a1-a3" class="path-line ok"    x1="561" y1="278" x2="630" y2="124" style="--len:170"/>
      <line id="seg-a3-a4" class="path-line ok"    x1="630" y1="124" x2="754" y2="99"  style="--len:130"/>

      <!-- points -->
      <g id="pt-h1" class="pt">
        <circle cx="232" cy="482" r="12" fill="var(--brown)"/>
        <text x="232" y="516" text-anchor="middle">human baseline</text>
        <text class="tag" x="232" y="534" text-anchor="middle">112 tok/s · TTFT 298ms</text>
      </g>

      <g id="pt-a1" class="pt">
        <circle cx="561" cy="278" r="12" fill="var(--blue)"/>
        <text x="561" y="256" text-anchor="middle">iteration 1</text>
        <text class="tag" x="561" y="238" text-anchor="middle">143 tok/s · TTFT 412ms</text>
      </g>

      <g id="pt-a2" class="pt">
        <circle cx="728" cy="360" r="12" fill="var(--red)"/>
        <text x="728" y="394" text-anchor="middle">iteration 2, rejected</text>
        <text class="tag" x="728" y="412" text-anchor="middle">TTFT 621ms &gt; 500ms limit</text>
      </g>

      <g id="pt-a3" class="pt">
        <circle cx="630" cy="124" r="12" fill="var(--blue)"/>
        <text x="630" y="102" text-anchor="middle">iteration 3, power capped</text>
        <text class="tag" x="630" y="152" text-anchor="middle">150 tok/s · TTFT 380ms</text>
      </g>

      <g id="pt-a4" class="pt">
        <circle cx="754" cy="99" r="14" fill="var(--gold)"/>
        <text x="754" y="70" text-anchor="middle">new champion</text>
        <text class="tag" x="754" y="52" text-anchor="middle">161 tok/s · best efficiency</text>
      </g>
    </svg>
  </div>

  <div id="eqn">
    <div class="code">score = tokens/s  if TTFT ≤ 500ms  else 0</div>
    <div class="caption">the whole search, in one line</div>
  </div>
</div>
</body>
</html>
